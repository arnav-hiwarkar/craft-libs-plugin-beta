[package]
name = "craft-plugin-ui-framework"
description = "Craft Plugin Kit on the craft UI framework: draws a plug-in's widget tree with framework components and returns the same events as the egui painter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
test = false

[lints]
workspace = true

[features]
testing = ["craft-ui/testing"]

[dependencies]
craft-plugin = { workspace = true }
craft-behavior = { workspace = true }
craft-color-ui = { workspace = true, features = ["ui"] }
craft-imaging = { workspace = true, features = ["ui"] }
craft-theme = { workspace = true }
craft-ui = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
craft-plugin-ui = { workspace = true, features = ["conformance"] }
craft-plugin-host = { workspace = true, features = ["testing"] }
egui_kittest = "0.37"
serde_json = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
