[package]
name = "craft-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Source-level platform regression guards and verification utilities for the Craft application suite"
publish = false

[features]
corpus = ["dep:serde", "dep:sha2", "dep:toml"]
lockcheck = ["dep:serde", "dep:toml"]

[dependencies]
serde = { workspace = true, optional = true }
sha2 = { version = "0.10", default-features = false, features = ["std"], optional = true }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
