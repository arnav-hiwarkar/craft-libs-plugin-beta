[package]
name = "craft-plugin-host"
description = "Craft Plugin Kit host runtime: loads sandboxed WebAssembly and trusted native plugins, enforces permissions, keeps the installed set"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
craft-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
bytemuck = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
tempfile = { version = "3.27", optional = true }

[features]
testing = ["dep:image", "dep:tempfile"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.8"
wasmtime = { version = "51", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
sha2 = "0.10"
same-file = "1.0"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
craft-plugin-host = { path = ".", features = ["testing"] }
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libloading = "0.8"

[[test]]
name = "it"
path = "tests/it/main.rs"
